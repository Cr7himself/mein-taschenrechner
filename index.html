<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jwan Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #000;
        }

        .creator {
            position: fixed;
            top: 22px;
            right: 28px;

            color: #777;
            font-size: 15px;
        }

        .calculator {
            width: 360px;
            padding: 20px;

            background: #000;
        }

        .title {
            color: white;
            text-align: center;

            font-size: 20px;
            font-weight: 500;

            margin-bottom: 20px;
        }

        .display {
            width: 100%;
            height: 120px;

            padding: 10px;

            border: none;
            outline: none;

            background: transparent;
            color: white;

            font-size: 64px;
            font-weight: 300;

            text-align: right;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        button {
            width: 72px;
            height: 72px;

            border: none;
            border-radius: 50%;

            background: #333333;
            color: white;

            font-size: 28px;
            font-weight: 400;

            cursor: pointer;

            transition: filter 0.1s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.2);
        }

        button:active {
            transform: scale(0.94);
        }

        .function {
            background: #a5a5a5;
            color: #000;
        }

        .operator {
            background: #ff9f0a;
            color: white;
        }

        .operator.active {
            background: white;
            color: #ff9f0a;
        }

        .equals {
            background: #ff9f0a;
            color: white;
        }

        .zero {
            width: 156px;
            border-radius: 36px;

            grid-column: span 2;

            text-align: left;
            padding-left: 28px;
        }

        @media (max-width: 400px) {

            .calculator {
                width: 100%;
                padding: 15px;
            }

            button {
                width: 68px;
                height: 68px;
            }

            .zero {
                width: 148px;
            }
        }
    </style>
</head>

<body>

    <div class="creator">
        by Jwan
    </div>

    <div class="calculator">

        <div class="title">
            Taschenrechner
        </div>

        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >

        <div class="buttons">

            <button class="function" onclick="clearCalculator()">AC</button>
            <button class="function" onclick="deleteNumber()">⌫</button>
            <button class="function" onclick="calculatePercent()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>


    <script>

        let firstNumber = "";
        let operator = "";
        let waitingForSecondNumber = false;


        function addNumber(number) {

            const display = document.getElementById("display");

            if (waitingForSecondNumber) {

                display.value = number;

                waitingForSecondNumber = false;

            }
            else if (display.value === "0") {

                display.value = number;

            }
            else {

                display.value = display.value + number;

            }
        }


        function chooseOperator(selectedOperator) {

            const display = document.getElementById("display");

            firstNumber = Number(display.value);

            operator = selectedOperator;

            waitingForSecondNumber = true;
        }


        function calculate() {

            const display = document.getElementById("display");

            const secondNumber = Number(display.value);

            let result;


            if (operator === "+") {

                result = firstNumber + secondNumber;

            }
            else if (operator === "-") {

                result = firstNumber - secondNumber;

            }
            else if (operator === "*") {

                result = firstNumber * secondNumber;

            }
            else if (operator === "/") {

                if (secondNumber === 0) {

                    display.value = "Fehler";

                    return;
                }

                result = firstNumber / secondNumber;

            }
            else {

                return;
            }


            display.value = result;

            firstNumber = "";
            operator = "";

            waitingForSecondNumber = true;
        }


        function calculatePercent() {

            const display = document.getElementById("display");

            const number = Number(display.value);

            display.value = number / 100;

            waitingForSecondNumber = true;
        }


        function clearCalculator() {

            const display = document.getElementById("display");

            display.value = "0";

            firstNumber = "";
            operator = "";

            waitingForSecondNumber = false;
        }


        function deleteNumber() {

            const display = document.getElementById("display");

            if (display.value.length > 1) {

                display.value =
                    display.value.slice(0, -1);

            }
            else {

                display.value = "0";

            }
        }

    </script>

</body>
</html>
