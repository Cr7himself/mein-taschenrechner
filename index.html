<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jwan Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont,
                         "SF Pro Display", "Helvetica Neue", Arial, sans-serif;

            background: #000;
        }

        .creator {
            position: fixed;
            top: 22px;
            right: 28px;

            color: #777;
            font-size: 15px;
        }

        .calculator {
            width: 360px;
            padding: 20px;

            background: #000;
        }

        .display {
            width: 100%;
            height: 145px;

            display: flex;
            justify-content: flex-end;
            align-items: flex-end;

            padding: 10px 5px 20px;

            color: white;

            font-size: 64px;
            font-weight: 300;

            white-space: nowrap;

            overflow: hidden;

            text-align: right;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        button {
            width: 72px;
            height: 72px;

            border: none;
            border-radius: 50%;

            background: #333;
            color: white;

            font-size: 28px;
            font-weight: 400;

            cursor: pointer;

            transition: filter 0.1s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.2);
        }

        button:active {
            transform: scale(0.94);
        }

        .function {
            background: #a5a5a5;
            color: #000;
        }

        .operator {
            background: #ff9f0a;
            color: white;
        }

        .equals {
            background: #ff9f0a;
            color: white;
        }

        .zero {
            width: 156px;

            border-radius: 36px;

            grid-column: span 2;

            text-align: left;

            padding-left: 28px;
        }

        @media (max-width: 400px) {

            .calculator {
                width: 100%;
                padding: 15px;
            }

            button {
                width: 68px;
                height: 68px;
            }

            .zero {
                width: 148px;
            }
        }
    </style>
</head>

<body>

    <div class="creator">
        by Jwan
    </div>

    <div class="calculator">

        <div id="display" class="display">0</div>

        <div class="buttons">

            <button class="function" onclick="clearCalculator()">AC</button>
            <button class="function" onclick="deleteNumber()">⌫</button>
            <button class="function" onclick="calculatePercent()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>


    <script>

        let firstNumber = "";
        let operator = "";
        let currentNumber = "0";
        let calculationFinished = false;


        /*
            DAS DISPLAY AKTUALISIEREN
        */

        function updateDisplay() {

            const display =
                document.getElementById("display");

            let text = "";


            if (operator !== "") {

                if (currentNumber === "") {

                    text =
                        firstNumber +
                        " " +
                        getOperatorSymbol(operator);

                } else {

                    text =
                        firstNumber +
                        " " +
                        getOperatorSymbol(operator) +
                        " " +
                        currentNumber;
                }

            } else {

                text = currentNumber;
            }


            display.textContent = text;


            /*
                SCHRIFTGRÖSSE BERECHNEN
            */

            fitTextToDisplay();
        }


        /*
            DIESE FUNKTION IST FÜR
            DAS PROBLEM VERANTWORTLICH
        */

        function fitTextToDisplay() {

            const display =
                document.getElementById("display");

            const text =
                display.textContent;


            /*
                Verfügbare Breite
            */

            const availableWidth =
                display.clientWidth - 10;


            /*
                Canvas zum Messen
                der echten Textbreite
            */

            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");


            /*
                Startgröße
            */

            let fontSize = 64;


            /*
                Schriftart exakt wie
                beim Display
            */

            context.font =
                "300 " +
                fontSize +
                "px -apple-system, BlinkMacSystemFont, " +
                "\"SF Pro Display\", \"Helvetica Neue\", Arial";


            /*
                Textbreite messen
            */

            let textWidth =
                context.measureText(text).width;


            /*
                Solange der Text zu breit ist,
                Schrift kleiner machen
            */

            while (
                textWidth > availableWidth &&
                fontSize > 18
            ) {

                fontSize -= 1;


                context.font =
                    "300 " +
                    fontSize +
                    "px -apple-system, BlinkMacSystemFont, " +
                    "\"SF Pro Display\", \"Helvetica Neue\", Arial";


                textWidth =
                    context.measureText(text).width;
            }


            /*
                Ergebnis anwenden
            */

            display.style.fontSize =
                fontSize + "px";
        }


        /*
            RECHENZEICHEN
        */

        function getOperatorSymbol(operator) {

            if (operator === "*") {
                return "×";
            }

            if (operator === "/") {
                return "÷";
            }

            if (operator === "-") {
                return "−";
            }

            if (operator === "+") {
                return "+";
            }

            return operator;
        }


        /*
            ZAHL EINGEBEN
        */

        function addNumber(number) {

            if (calculationFinished) {

                currentNumber = number;

                firstNumber = "";
                operator = "";

                calculationFinished = false;

            }

            else if (
                currentNumber === "0" &&
                number !== "."
            ) {

                currentNumber = number;

            }

            else if (
                number === "." &&
                currentNumber.includes(".")
            ) {

                return;

            }

            else {

                currentNumber += number;
            }


            updateDisplay();
        }


        /*
            OPERATOR
        */

        function chooseOperator(selectedOperator) {

            if (
                operator !== "" &&
                currentNumber !== ""
            ) {

                calculate(false);
            }


            firstNumber =
                currentNumber;

            operator =
                selectedOperator;

            currentNumber =
                "";

            calculationFinished =
                false;


            updateDisplay();
        }


        /*
            BERECHNEN
        */

        function calculate(showResult = true) {

            if (
                operator === "" ||
                currentNumber === ""
            ) {

                return;
            }


            const number1 =
                Number(firstNumber);

            const number2 =
                Number(currentNumber);

            let result;


            if (operator === "+") {

                result =
                    number1 + number2;

            }

            else if (operator === "-") {

                result =
                    number1 - number2;

            }

            else if (operator === "*") {

                result =
                    number1 * number2;

            }

            else if (operator === "/") {

                if (number2 === 0) {

                    currentNumber =
                        "Fehler";

                    firstNumber = "";
                    operator = "";

                    updateDisplay();

                    return;
                }

                result =
                    number1 / number2;
            }


            currentNumber =
                String(result);

            firstNumber = "";
            operator = "";


            if (showResult) {

                calculationFinished =
                    true;
            }


            updateDisplay();
        }


        /*
            PROZENT
        */

        function calculatePercent() {

            if (currentNumber === "") {
                return;
            }


            const number =
                Number(currentNumber);


            currentNumber =
                String(number / 100);


            updateDisplay();
        }


        /*
            ALLES LÖSCHEN
        */

        function clearCalculator() {

            firstNumber = "";
            operator = "";

            currentNumber =
                "0";

            calculationFinished =
                false;


            updateDisplay();
        }


        /*
            LETZTE ZIFFER LÖSCHEN
        */

        function deleteNumber() {

            if (calculationFinished) {

                clearCalculator();

                return;
            }


            if (
                currentNumber.length > 1
            ) {

                currentNumber =
                    currentNumber.slice(0, -1);

            }

            else {

                currentNumber =
                    "0";
            }


            updateDisplay();
        }


        /*
            AUCH BEI FENSTERÄNDERUNG
            NEU ANPASSEN
        */

        window.addEventListener(
            "resize",
            updateDisplay
        );


        updateDisplay();

    </script>

</body>
</html>
