<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jwan Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f6f8;
        }

        .creator {
            position: fixed;
            top: 22px;
            right: 28px;

            color: #6b7280;
            font-size: 15px;
            font-weight: 500;
        }

        .calculator {
            width: 350px;
            padding: 24px;

            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 24px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 20px;

            color: #111827;

            font-size: 24px;
            font-weight: 600;
            text-align: center;
        }

        .display {
            width: 100%;
            height: 75px;

            margin-bottom: 18px;
            padding: 15px;

            border: 1px solid #e5e7eb;
            border-radius: 14px;

            background: #f9fafb;
            color: #111827;

            font-size: 30px;
            font-weight: 500;
            text-align: right;

            outline: none;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 62px;

            border: none;
            border-radius: 14px;

            background: #f1f3f5;
            color: #111827;

            font-size: 20px;
            font-weight: 500;

            cursor: pointer;

            transition: background 0.15s, transform 0.1s;
        }

        button:hover {
            background: #e5e7eb;
        }

        button:active {
            transform: scale(0.96);
        }

        .operator {
            background: #e8eefc;
            color: #2563eb;
        }

        .operator:hover {
            background: #dbe7ff;
        }

        .clear {
            background: #fee2e2;
            color: #dc2626;
        }

        .clear:hover {
            background: #fecaca;
        }

        .equals {
            background: #2563eb;
            color: white;
        }

        .equals:hover {
            background: #1d4ed8;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="creator">
        by Jwan
    </div>

    <div class="calculator">

        <h1>Taschenrechner</h1>

        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >

        <div class="buttons">

            <button class="clear" onclick="clearCalculator()">C</button>
            <button onclick="deleteNumber()">⌫</button>
            <button onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

    </div>


    <script>

        let firstNumber = "";
        let operator = "";
        let waitingForSecondNumber = false;


        function addNumber(number) {

            const display = document.getElementById("display");

            if (waitingForSecondNumber) {

                display.value = number;

                waitingForSecondNumber = false;

            }
            else if (display.value === "0") {

                display.value = number;

            }
            else {

                display.value = display.value + number;

            }
        }


        function chooseOperator(selectedOperator) {

            const display = document.getElementById("display");

            firstNumber = Number(display.value);

            operator = selectedOperator;

            waitingForSecondNumber = true;
        }


        function calculate() {

            const display = document.getElementById("display");

            const secondNumber = Number(display.value);

            let result;


            if (operator === "+") {

                result = firstNumber + secondNumber;

            }
            else if (operator === "-") {

                result = firstNumber - secondNumber;

            }
            else if (operator === "*") {

                result = firstNumber * secondNumber;

            }
            else if (operator === "/") {

                if (secondNumber === 0) {

                    display.value = "Fehler";

                    return;
                }

                result = firstNumber / secondNumber;

            }
            else if (operator === "%") {

                result = firstNumber % secondNumber;

            }
            else {

                return;
            }


            display.value = result;

            firstNumber = "";
            operator = "";

            waitingForSecondNumber = true;
        }


        function clearCalculator() {

            document.getElementById("display").value = "0";

            firstNumber = "";
            operator = "";

            waitingForSecondNumber = false;
        }


        function deleteNumber() {

            const display = document.getElementById("display");

            if (display.value.length > 1) {

                display.value =
                    display.value.slice(0, -1);

            }
            else {

                display.value = "0";

            }
        }

    </script>

</body>
</html>
